services:
  postgres:
    image: postgres:16
    container_name: ${POSTGRES_DB_CONTAINER_NAME}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # stdio MCP server — never a long-running daemon, so it's gated behind a
  # profile and must be launched with `run`, never `up -d`:
  #   docker compose --profile mcp run --rm -i mcp
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: fms-mcp:local
    profiles: ["mcp"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true

  # Streamable HTTP MCP server — unlike `mcp` above, this one is a
  # legitimate long-running daemon (no stdin to pipe), meant for locally
  # smoke-testing the HTTP transport before picking a remote host later.
  # Same image/Dockerfile as `mcp`; transport mode is selected at runtime
  # via MCP_TRANSPORT. Gated behind its own profile so a plain
  # `pnpm docker:up` never exposes it — opt in with:
  #   docker compose --profile mcp-http up -d mcp-http
  mcp-http:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: fms-mcp:local
    profiles: ["mcp-http"]
    restart: unless-stopped
    environment:
      MCP_TRANSPORT: http
      MCP_API_KEY: ${MCP_API_KEY}
      PORT: "3000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${MCP_HTTP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
    name: pg-data
    driver: local
  pgadmin-data:
    name: pgadmin-data
    driver: local
    